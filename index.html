const DIPESH_SYSTEM_PROMPT = `
You are the official AI representative for Dipesh Kharel.

async function callGeminiAPI(userQuery) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
    const payload = {
        contents: [...chatHistory, { role: "user", parts: [{ text: userQuery }] }],
        systemInstruction: { parts: [{ text: DIPESH_SYSTEM_PROMPT }] }
    };

    let delays = [1000, 2000, 4000, 8000];
    for (let i = 0; i <= delays.length; i++) {
        try {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
                chatHistory.push({ role: "user", parts: [{ text: userQuery }] });
                chatHistory.push({ role: "model", parts: [{ text: text }] });
                return text;
            }
        } catch (e) {
            if (i === delays.length) throw e;
            await new Promise(r => setTimeout(r, delays[i]));
        }
    }
    return "Connection error. Please try again.";
}

async function sendAIMessage() {
    const input = document.getElementById('aiUserInput');
    const query = input.value.trim();
    if (!query) return;

    const body = document.getElementById('aiChatBody');
    body.innerHTML += `<div class="ai-msg user">${escapeHtml(query)}</div>`;
    input.value = '';
    body.scrollTop = body.scrollHeight;

    const loadId = 'load-' + Date.now();
    body.innerHTML += `<div class="ai-msg bot" id="${loadId}">⚡ Processing...</div>`;
    body.scrollTop = body.scrollHeight;

    try {
        const text = await callGeminiAPI(query);
        const loadEl = document.getElementById(loadId);
        if (loadEl) {
            loadEl.innerHTML = formatAIResponse(text) + `<br><span class="tts-btn" onclick="speakText(this)">🔊 Listen</span>`;
        }
    } catch (err) {
        const loadEl = document.getElementById(loadId);
        if (loadEl) loadEl.innerHTML = "Unable to process message right now.";
    }
    body.scrollTop = body.scrollHeight;
}

function sendPill(text) {
    document.getElementById('aiUserInput').value = text;
    sendAIMessage();
}

function formatAIResponse(text) {
    let formatted = escapeHtml(text);
    formatted = formatted.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--gold);text-decoration:underline;">$1</a>');
    formatted = formatted.replace(/\n/g, '<br>');
    return formatted;
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function speakText(btn) {
    const text = btn.parentElement.innerText.replace('🔊 Listen', '');
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
    }
}

function runSandboxCode() {
    const code = document.getElementById('sandboxCode').value;
    const output = document.getElementById('sandboxOutput');

    try {

        const customConsole = {
            log: (...args) => logs.push(args.join(' ')),
            error: (...args) => logs.push('ERROR: ' + args.join(' '))
        };
        const runFn = new Function('console', code);
        runFn(customConsole);
        if (code.includes('<') && code.includes('>')) {
            output.innerHTML = code;
        } else {
            output.innerHTML = logs.length ? logs.join('<br>') : 'Code executed successfully with no console output.';
        }
    } catch (e) {
        output.innerHTML = `<span style="color:#ef4444;">Runtime Error: ${e.message}</span>`;
    }
}

// DRAGGABLE CIRCULAR AI BUTTON LOGIC
(function() {
    const badge = document.getElementById('draggable-ai-badge');
    let isDragging = false, startX, startY, initialLeft, initialTop;

    badge.addEventListener('mousedown', startDrag);
    badge.addEventListener('touchstart', startDrag, { passive: false });

    function startDrag(e) {
        isDragging = false;
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        startX = clientX; startY = clientY;
        const rect = badge.getBoundingClientRect();
        initialLeft = rect.left; initialTop = rect.top;

        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);
    }

    function onDrag(e) {
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        const dx = clientX - startX, dy = clientY - startY;

        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;

        if (isDragging) {
            if (e.cancelable) e.preventDefault();
            badge.style.left = (initialLeft + dx) + 'px';
            badge.style.top = (initialTop + dy) + 'px';
            badge.style.bottom = 'auto'; badge.style.right = 'auto';
        }
    }

    function stopDrag() {
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchend', stopDrag);
    }
})();
